name: Verify and release

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

env:
  GO_VERSION: "1.27"

# Five stages, each gated on the whole of the previous one:
#
#   security  gitleaks | trufflehog | govulncheck | gosec | tidy
#   lint      golangci-lint | fmt | vet
#   test      race + coverage
#   build     linux/amd64 | linux/arm64 | darwin/arm64 | windows/amd64   (tags only)
#   release   image + GitHub release                                     (tags only)
#
# Jobs inside a stage run in parallel and are independent of one another, so a
# single failing scanner does not hide what the others would have found. A stage
# starts only when every job of the stage before it has passed, so a secret
# leak still stops the run before anything is compiled, and nothing is released
# that has not passed all four verification stages.
jobs:

  # ---------------------------------------------------------------- security

  security-gitleaks:
    name: "security: gitleaks"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          # gitleaks needs history to scan past commits, not just the tip.
          fetch-depth: 0
      - name: secrets in tree and history
        run: |
          docker run --rm -v "$PWD:/src" -w /src \
            ghcr.io/gitleaks/gitleaks:v8.30.1 \
            detect --source=/src --redact --verbose --exit-code 1

  security-trufflehog:
    name: "security: trufflehog"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: verified secrets
        run: |
          docker run --rm -v "$PWD:/src" \
            trufflesecurity/trufflehog:3.97.1 \
            filesystem /src --results=verified,unknown --fail

  security-govulncheck:
    name: "security: govulncheck"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: dependency vulnerabilities reachable from this code
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
          govulncheck ./...

  security-gosec:
    name: "security: gosec"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: static analysis of our own code
        # Installed rather than pulled: the securego/gosec image lags the
        # releases by months (2.24.6 vs v2.29.0), and this keeps CI on the same
        # version as `make gosec`.
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@v2.29.0
          gosec -severity medium -confidence medium -exclude-dir=docs ./...

  security-tidy:
    name: "security: go.mod is tidy"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: go.mod and go.sum would not change
        run: go mod tidy -diff

  # -------------------------------------------------------------------- lint

  lint-golangci:
    name: "lint: golangci-lint"
    needs: [security-gitleaks, security-trufflehog, security-govulncheck, security-gosec, security-tidy]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: golangci-lint run
        run: |
          docker run --rm -v "$PWD:/src" -w /src \
            golangci/golangci-lint:v2.13.2 \
            golangci-lint run --timeout 5m

  lint-fmt:
    name: "lint: formatting"
    needs: [security-gitleaks, security-trufflehog, security-govulncheck, security-gosec, security-tidy]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: gofmt and goimports leave no diff
        run: |
          docker run --rm -v "$PWD:/src" -w /src \
            golangci/golangci-lint:v2.13.2 \
            golangci-lint fmt --diff

  lint-vet:
    name: "lint: go vet"
    needs: [security-gitleaks, security-trufflehog, security-govulncheck, security-gosec, security-tidy]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: go vet
        run: go vet ./...

  # -------------------------------------------------------------------- test

  test:
    name: "test: race + coverage"
    needs: [lint-golangci, lint-fmt, lint-vet]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: test with race detector
        # CGO is required by -race, so it is enabled here only.
        env:
          CGO_ENABLED: "1"
        run: go test ./... -race -covermode=atomic -coverprofile=coverage.out
      - name: coverage summary
        run: go tool cover -func=coverage.out
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: coverage
          path: coverage.out
          retention-days: 7

  # ------------------------------------------------------------------- build

  build:
    name: "build: ${{ matrix.goos }}/${{ matrix.goarch }}"
    needs: test
    # Binaries are produced for tags only. Branches stop after test.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          out="atlassian-mcp-lite_${GOOS}_${GOARCH}"
          [ "$GOOS" = windows ] && out="${out}.exe"
          # The version lives in internal/core, not package main: the linker
          # silently ignores an -X for a symbol that does not exist, which is
          # how every release binary came to report the hardcoded 0.1.0.
          go build -trimpath \
            -ldflags="-s -w -X github.com/OxCom/atlassian-mcp-lite/internal/core.Version=${GITHUB_REF_NAME}" \
            -o "dist/${out}" ./cmd/atlassian-mcp-lite
      - name: checksums
        run: |
          cd dist
          sha256sum * > "SHA256SUMS_${{ matrix.goos }}_${{ matrix.goarch }}"
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: dist-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*

  # ----------------------------------------------------------------- release

  release-image:
    name: "release: container image"
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7.0.1
      - name: build and push to ghcr.io
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
            docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          # Lowercased: a Docker repository component must be, and the owner
          # here is "OxCom". github.repository preserves that capitalisation,
          # so the reference would be rejected before anything is pushed.
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker build \
            --build-arg VERSION="${GITHUB_REF_NAME}" \
            -t "${IMAGE}:${GITHUB_REF_NAME}" -t "${IMAGE}:latest" .
          docker push "${IMAGE}:${GITHUB_REF_NAME}"
          docker push "${IMAGE}:latest"

  release-github:
    name: "release: GitHub release"
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: collect build artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v3.0.3
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
