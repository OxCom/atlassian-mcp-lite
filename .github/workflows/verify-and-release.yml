name: Verify and release

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

env:
  GO_VERSION: "1.27"

# Five stages, each gated on the whole of the previous one:
#
#   security  gitleaks | trufflehog | govulncheck | gosec | tidy
#   lint      golangci-lint | fmt | vet
#   test      race + coverage
#   build     linux/amd64 | linux/arm64 | darwin/{arm64,amd64} | windows/amd64  (tags only)
#   release   image + GitHub release                                     (tags only)
#
# Jobs inside a stage run in parallel and are independent of one another, so a
# single failing scanner does not hide what the others would have found. A stage
# starts only when every job of the stage before it has passed, so a secret
# leak still stops the run before anything is compiled, and nothing is released
# that has not passed all four verification stages.
#
# gosec, golangci-lint, vet and test each run twice, once untagged and once with
# -tags selfupdate, as a matrix axis inside the existing job rather than as new
# jobs: code behind a build tag is invisible to every one of those tools unless
# it is asked for, and adding jobs would mean editing the `needs:` list of every
# job in the following stage. `needs:` names a job id, and waits for all of that
# job's matrix legs, so the stage gating below is unchanged.
jobs:

  # ---------------------------------------------------------------- security

  security-gitleaks:
    name: "security: gitleaks"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # gitleaks needs history to scan past commits, not just the tip.
          fetch-depth: 0
          persist-credentials: false
      - name: secrets in tree and history
        run: |
          docker run --rm -v "$PWD:/src" -w /src \
            ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            detect --source=/src --redact --verbose --exit-code 1

  security-trufflehog:
    name: "security: trufflehog"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: verified secrets
        run: |
          docker run --rm -v "$PWD:/src" \
            trufflesecurity/trufflehog:3.97.1@sha256:deb2af10659a488a14d262a323addcde099d99827a1cf1dc4e93c17915c39f08 \
            filesystem /src --results=verified,unknown --fail

  security-govulncheck:
    name: "security: govulncheck"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: dependency vulnerabilities reachable from this code
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
          govulncheck ./...

  security-gosec:
    name: "security: gosec (${{ matrix.label }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - tags: ""
            label: default
          - tags: selfupdate
            label: selfupdate
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: static analysis of our own code
        # Installed rather than pulled: the securego/gosec image lags the
        # releases by months (2.24.6 vs v2.29.0), and this keeps CI on the same
        # version as `make gosec`.
        env:
          TAGS: ${{ matrix.tags }}
        run: |
          set -eu
          go install github.com/securego/gosec/v2/cmd/gosec@v2.29.0
          if [ -n "$TAGS" ]; then set -- -tags "$TAGS"; fi
          gosec -severity medium -confidence medium -exclude-dir=docs "$@" ./...

  security-tidy:
    name: "security: go.mod is tidy"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: go.mod and go.sum would not change
        run: go mod tidy -diff

  # -------------------------------------------------------------------- lint

  lint-golangci:
    name: "lint: golangci-lint (${{ matrix.label }})"
    needs: [security-gitleaks, security-trufflehog, security-govulncheck, security-gosec, security-tidy]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - tags: ""
            label: default
          - tags: selfupdate
            label: selfupdate
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: golangci-lint run
        env:
          TAGS: ${{ matrix.tags }}
        run: |
          set -eu
          if [ -n "$TAGS" ]; then set -- --build-tags "$TAGS"; fi
          docker run --rm -v "$PWD:/src" -w /src \
            golangci/golangci-lint:v2.13.2@sha256:ba07dffad130794ae79ebaa0056809d18c0168f3f846480ffd3eb6c04578b83d \
            golangci-lint run --timeout 5m "$@"

  lint-fmt:
    name: "lint: formatting"
    needs: [security-gitleaks, security-trufflehog, security-govulncheck, security-gosec, security-tidy]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: gofmt and goimports leave no diff
        run: |
          docker run --rm -v "$PWD:/src" -w /src \
            golangci/golangci-lint:v2.13.2@sha256:ba07dffad130794ae79ebaa0056809d18c0168f3f846480ffd3eb6c04578b83d \
            golangci-lint fmt --diff

  lint-vet:
    name: "lint: go vet (${{ matrix.label }})"
    needs: [security-gitleaks, security-trufflehog, security-govulncheck, security-gosec, security-tidy]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - tags: ""
            label: default
          - tags: selfupdate
            label: selfupdate
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: go vet
        env:
          TAGS: ${{ matrix.tags }}
        run: |
          set -eu
          if [ -n "$TAGS" ]; then set -- -tags "$TAGS"; fi
          go vet "$@" ./...

  # -------------------------------------------------------------------- test

  test:
    name: "test: race + coverage (${{ matrix.label }})"
    needs: [lint-golangci, lint-fmt, lint-vet]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - tags: ""
            label: default
          - tags: selfupdate
            label: selfupdate
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: test with race detector
        # CGO is required by -race, so it is enabled here only.
        env:
          CGO_ENABLED: "1"
          TAGS: ${{ matrix.tags }}
        run: |
          set -eu
          if [ -n "$TAGS" ]; then set -- -tags "$TAGS"; fi
          go test ./... -race -covermode=atomic -coverprofile=coverage.out "$@"
      - name: coverage summary
        run: go tool cover -func=coverage.out
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          # One name per matrix leg: two legs uploading the same artifact name
          # is an error, and the two coverage profiles are not the same run.
          name: coverage-${{ matrix.label }}
          path: coverage.out
          retention-days: 7

  # ------------------------------------------------------------------- build

  build:
    name: "build: ${{ matrix.goos }}/${{ matrix.goarch }}"
    needs: test
    # Binaries are produced for tags only. Branches stop after test.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: arm64
          # Intel Macs are still in use and cannot run a darwin/arm64 binary.
          - goos: darwin
            goarch: amd64
          - goos: windows
            goarch: amd64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          set -eu
          # Two variants per target. The self-updater downloads the asset whose
          # name matches its own build, so a selfupdate binary must find a
          # selfupdate asset: publishing only the default one would make every
          # update a downgrade to a binary that can no longer update itself.
          for variant in "" selfupdate; do
            if [ -z "$variant" ]; then
              out="atlassian-mcp-lite_${GOOS}_${GOARCH}"
              set --
            else
              out="atlassian-mcp-lite-${variant}_${GOOS}_${GOARCH}"
              set -- -tags "$variant"
            fi
            if [ "$GOOS" = windows ]; then out="${out}.exe"; fi
            echo "building ${out}"
            # The version lives in internal/core, not package main: the linker
            # silently ignores an -X for a symbol that does not exist, which is
            # how every release binary came to report the hardcoded 0.1.0.
            go build -trimpath "$@" \
              -ldflags="-s -w -X github.com/OxCom/atlassian-mcp-lite/internal/core.Version=${GITHUB_REF_NAME}" \
              -o "dist/${out}" ./cmd/atlassian-mcp-lite
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*

  # ----------------------------------------------------------------- release

  release-image:
    name: "release: container image"
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: build and push to ghcr.io
        # The token and the actor reach the script as environment variables,
        # never as ${{ }} interpolation. Interpolation pastes the value into
        # the script text before the shell sees it, so a value containing
        # shell syntax would be executed rather than read; an env var is data
        # whatever it contains. Neither value is attacker-controlled today,
        # which is why this is hardening rather than a fix.
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: |
          printf '%s' "$GHCR_TOKEN" | \
            docker login ghcr.io -u "$GHCR_USER" --password-stdin
          # Lowercased: a Docker repository component must be, and the owner
          # here is "OxCom". github.repository preserves that capitalisation,
          # so the reference would be rejected before anything is pushed.
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker build \
            --build-arg VERSION="${GITHUB_REF_NAME}" \
            -t "${IMAGE}:${GITHUB_REF_NAME}" -t "${IMAGE}:latest" .
          docker push "${IMAGE}:${GITHUB_REF_NAME}"
          docker push "${IMAGE}:latest"

  release-github:
    name: "release: GitHub release"
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: collect build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      # One checksum file over every artifact, not one per platform: a user
      # verifying a download should need a single file, and `sha256sum -c`
      # against it reports the other entries as missing rather than failing.
      - name: checksums
        run: |
          cd dist
          sha256sum ./* > SHA256SUMS
          cat SHA256SUMS
      # ed25519 detached signature over the bytes of SHA256SUMS. A self-update
      # build verifies it with a public key compiled into the binary, so an
      # attacker who can replace a release asset still cannot make it run: the
      # checksum file is the only thing that has to be trusted, and this is what
      # makes it trustworthy. openssl signs ed25519 natively, so no new action
      # and no new program enters the release path.
      - name: sign checksums
        # The key reaches the script as an environment variable, never as a
        # ${{ }} interpolation: interpolation pastes the value into the script
        # text before the shell parses it, so a key containing shell syntax
        # would be executed rather than read, and it would be one `set -x` away
        # from the log. openssl will not read a key from a variable, so it is
        # written to a private temp file that a trap removes on every exit path.
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          set -eu
          if [ -z "${RELEASE_SIGNING_KEY:-}" ]; then
            # Not fatal: a repository without the secret still publishes a
            # usable release. Only self-update is lost, and it fails closed on
            # its own when the signature is missing.
            echo "::warning::RELEASE_SIGNING_KEY is not set - publishing SHA256SUMS unsigned; self-update builds will refuse this release."
            exit 0
          fi
          keydir="$(mktemp -d)"
          trap 'rm -rf "$keydir"' EXIT
          # umask is scoped to the key write: outside the subshell the runner's
          # default applies, so the published SHA256SUMS.sig keeps ordinary
          # permissions while the key is never briefly world-readable.
          (umask 077; printf '%s\n' "$RELEASE_SIGNING_KEY" > "$keydir/signing.pem")
          chmod 600 "$keydir/signing.pem"
          openssl pkeyutl -sign -rawin -inkey "$keydir/signing.pem" \
            -in dist/SHA256SUMS -out dist/SHA256SUMS.sig
          # Verify against the public half derived from the same key, so a key
          # that signs into something unusable fails here and not in every
          # installed binary.
          openssl pkey -in "$keydir/signing.pem" -pubout -out "$keydir/signing.pub"
          openssl pkeyutl -verify -rawin -pubin -inkey "$keydir/signing.pub" \
            -in dist/SHA256SUMS -sigfile dist/SHA256SUMS.sig
          ls -l dist/SHA256SUMS.sig

      - name: create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -e
          ls dist/* >/dev/null
          gh release create "$GITHUB_REF_NAME" dist/* --generate-notes --verify-tag
