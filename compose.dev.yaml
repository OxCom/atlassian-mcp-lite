# Development toolchain. Nothing is installed on the host: every tool runs in a
# pinned container. Use the Makefile targets rather than these directly.
#
#   docker compose -f compose.dev.yaml run --rm <service>
#
# The module cache is a named volume so repeated runs do not re-download.
#
# TAGS selects a build-tag variant: `TAGS=selfupdate make test` runs the same
# checks over the code behind //go:build selfupdate, which is invisible to the
# compiler — and therefore to test, vet, lint and gosec — unless it is asked
# for. Empty TAGS (the default) adds no flag at all, so the untagged run is
# byte-for-byte the command it always was. Each service re-lists the environment
# it needs because a YAML merge key replaces the whole `environment` mapping
# rather than adding to it.

name: atlassian-mcp-lite-dev

x-go: &go
  # Debian, not Alpine. The race detector needs cgo and a C compiler; Alpine
  # ships neither, which previously forced -race into a separate service on a
  # second image. The codename is pinned because the bare `golang:1.27` tag
  # follows Debian stable and would change base distribution under us.
  image: golang:1.27-trixie@sha256:9baa6b4187bbb98d240372a8a235ac0bb6b5ddd52bba1431dc2f7c0705862728
  working_dir: /src
  volumes:
    - .:/src
    - gomod:/go/pkg/mod
    - gobuild:/root/.cache/go-build
  environment:
    CGO_ENABLED: "0"
    GOFLAGS: -buildvcs=false

services:
  # --- build and test ---
  build:
    <<: *go
    command: go build -trimpath -ldflags="-s -w" -o /src/bin/atlassian-mcp-lite ./cmd/atlassian-mcp-lite

  # Cross-compiled release binaries, the same set the tagged CI build
  # publishes, plus one SHA256SUMS over all of them. VERSION is stamped into
  # internal/core.Version, not package main: the linker silently ignores -X
  # for a symbol that does not exist.
  #
  # Every $$ is a literal dollar for the shell. Compose substitutes ${...}
  # itself before the container ever sees the script, and ${VERSION} below is
  # deliberately the one place where that is wanted.
  dist:
    <<: *go
    environment:
      CGO_ENABLED: "0"
      GOFLAGS: -buildvcs=false
      VERSION: ${VERSION:-dev}
    command:
      - sh
      - -c
      - |
        set -eu
        rm -rf /src/dist
        mkdir -p /src/dist
        for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
          GOOS=$${target%/*}
          GOARCH=$${target#*/}
          export GOOS GOARCH
          # Two variants per target. The self-updater replaces the running
          # binary with the asset matching its own name, so a selfupdate build
          # must find a selfupdate build to download: shipping only the default
          # asset would silently turn every update into a downgrade to a binary
          # that can no longer update itself.
          for variant in "" selfupdate; do
            if [ -z "$$variant" ]; then
              out="atlassian-mcp-lite_$${GOOS}_$${GOARCH}"
              tagflag=""
            else
              out="atlassian-mcp-lite-$${variant}_$${GOOS}_$${GOARCH}"
              tagflag="-tags $${variant}"
            fi
            if [ "$$GOOS" = windows ]; then out="$${out}.exe"; fi
            echo "building $${out}"
            # $$tagflag is deliberately unquoted: empty must expand to no
            # argument at all, not to an empty one.
            go build -trimpath $$tagflag \
              -ldflags="-s -w -X github.com/OxCom/atlassian-mcp-lite/internal/core.Version=$${VERSION}" \
              -o "/src/dist/$${out}" ./cmd/atlassian-mcp-lite
          done
        done
        cd /src/dist
        sha256sum ./* > SHA256SUMS
        cat SHA256SUMS

  # -race is the default now that the image has a C toolchain. CGO is enabled
  # for this service only; every build path stays CGO-free so the binary can
  # run in a scratch container.
  test:
    <<: *go
    environment:
      CGO_ENABLED: "1"
      GOFLAGS: -buildvcs=false
      TAGS: ${TAGS:-}
    command:
      - sh
      - -c
      - |
        set -eu
        if [ -n "$$TAGS" ]; then set -- -tags "$$TAGS"; fi
        exec go test ./... -race -covermode=atomic -coverprofile=coverage.out "$$@"

  cover:
    <<: *go
    command: sh -c "go test ./... -covermode=atomic -coverprofile=coverage.out && go tool cover -func=coverage.out"

  vet:
    <<: *go
    environment:
      CGO_ENABLED: "0"
      GOFLAGS: -buildvcs=false
      TAGS: ${TAGS:-}
    command:
      - sh
      - -c
      - |
        set -eu
        if [ -n "$$TAGS" ]; then set -- -tags "$$TAGS"; fi
        exec go vet "$$@" ./...

  tidy:
    <<: *go
    command: go mod tidy -diff

  # --- lint ---
  lint:
    image: golangci/golangci-lint:v2.13.2@sha256:ba07dffad130794ae79ebaa0056809d18c0168f3f846480ffd3eb6c04578b83d
    working_dir: /src
    volumes:
      - .:/src
      - gomod:/go/pkg/mod
      - golangci:/root/.cache/golangci-lint
    environment:
      TAGS: ${TAGS:-}
    command:
      - sh
      - -c
      - |
        set -eu
        if [ -n "$$TAGS" ]; then set -- --build-tags "$$TAGS"; fi
        exec golangci-lint run --timeout 5m "$$@"

  fmt:
    image: golangci/golangci-lint:v2.13.2@sha256:ba07dffad130794ae79ebaa0056809d18c0168f3f846480ffd3eb6c04578b83d
    working_dir: /src
    volumes:
      - .:/src
      - gomod:/go/pkg/mod
    command: golangci-lint fmt

  # --- security ---
  # Dependency vulnerabilities, filtered to those actually reachable from this
  # code. Covers both the module graph and our own call paths.
  govulncheck:
    <<: *go
    environment:
      CGO_ENABLED: "0"
      GOFLAGS: -buildvcs=false
      TAGS: ${TAGS:-}
    command:
      - sh
      - -c
      - |
        set -eu
        go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
        if [ -n "$$TAGS" ]; then set -- -tags "$$TAGS"; fi
        exec govulncheck "$$@" ./...

  # Static analysis of our own code. Installed with go install rather than run
  # from securego/gosec: that image lags the releases badly (2.24.6 in
  # February against v2.29.0 in August), and this way gosec shares the same
  # image, module cache and TLS trust configuration as every other Go tool.
  gosec:
    <<: *go
    environment:
      CGO_ENABLED: "0"
      GOFLAGS: -buildvcs=false
      TAGS: ${TAGS:-}
    command:
      - sh
      - -c
      - |
        set -eu
        go install github.com/securego/gosec/v2/cmd/gosec@v2.29.0
        if [ -n "$$TAGS" ]; then set -- -tags "$$TAGS"; fi
        exec gosec -severity medium -confidence medium "$$@" ./...


  # Secret scanning: committed files and full git history.
  gitleaks:
    image: ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
    working_dir: /src
    volumes:
      - .:/src
    command: detect --source=/src --redact --verbose

  trufflehog:
    image: trufflesecurity/trufflehog:3.97.4@sha256:562bc231afa9de3d04de44cfe624252b08207de1fc3cebc5e7ed92bed7f279e4
    working_dir: /src
    volumes:
      - .:/src
    command: filesystem /src --results=verified,unknown --fail

volumes:
  gomod:
  gobuild:
  golangci:
